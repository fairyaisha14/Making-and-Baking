<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Making and Baking 🍰</title>

    <style>
        body {
            font-family: "Comic Sans MS", cursive;
            background: linear-gradient(to right, #ffe4e1, #fff0f5);
            margin: 0;
            text-align: center;
        }

        header {
            background: #ffb6c1;
            padding: 25px;
            color: white;
            font-size: 35px;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 0 15px #ccc;
        }

        .info {
            background: #fff0f5;
            border: 2px dashed #ffb6c1;
            padding: 15px;
            border-radius: 15px;
        }

        input,
        textarea,
        select {

            width: 90%;
            padding: 12px;
            margin: 8px;
            border-radius: 12px;
            border: 1px solid #ccc;

        }

        textarea {
            height: 80px;
        }

        button {

            background: #ff69b4;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 18px;
            cursor: pointer;

        }

        button:hover {

            background: #ff1493;

        }

        .cake {
            font-size: 50px;
        }

        #priceDisplay {

            color: #ff1493;
            font-weight: bold;

        }
    </style>

</head>


<body>


    <header>
        Making and Baking 🍰
    </header>


    <div class="cake">
        🧁 🍪 🎂
    </div>



    <div class="container">


        <div class="info">

            <h2>About Our Classes</h2>

            <p>

                <strong>Girls-Only Classes</strong><br><br>

                <strong>100% Halal Ingredients Used</strong><br><br>

                <strong>Ages: 8–12</strong><br><br>

                <strong>£5 per session</strong><br><br>

                <strong>Class Times:</strong><br>

                Saturday 12pm–2pm<br>
                Saturday 2pm–4pm<br>
                Sunday 2pm–4pm

            </p>

        </div>


        <br>


        <h2>Book Your Class</h2>


        <form action="https://formspree.io/f/xeepvopl" method="POST">


            <input type="hidden" name="_subject" value="New Making and Baking Booking">


            <input type="text" name="_gotcha" style="display:none">



            <h3>Child Details</h3>


            <label>Number of Children Enrolling</label>


            <select id="childNumber" name="number_of_children" onchange="showChildren()" required>


                <option value="">
                    Choose Number of Children
                </option>


                <option value="1">
                    1 Child
                </option>


                <option value="2">
                    2 Children
                </option>


                <option value="3">
                    3 Children
                </option>


                <option value="4">
                    4 Children
                </option>


            </select>



            <div id="childrenDetails"></div>



            <p id="priceDisplay">
                Total Price: £0
            </p>





            <h3>Parent Details</h3>


            <input type="text" name="parent_name" placeholder="Parent's Name" required>


            <input type="text" name="parent_contact" placeholder="Parent's Contact Number" required>


            <input type="email" name="parent_email" placeholder="Parent's Email" required>





            <h3>Class Booking</h3>


            <select name="class_time" required>


                <option value="">
                    Choose a Class Time
                </option>


                <option>
                    Saturday 12pm - 2pm
                </option>


                <option>
                    Saturday 2pm - 4pm
                </option>


                <option>
                    Sunday 2pm - 4pm
                </option>


            </select>



            <br><br>


            <button type="submit">
                Submit Booking
            </button>


        </form>

</div>


<footer>

    © 2026 Making and Baking

</footer>




<script>


    function showChildren() {

        let number = document.getElementById("childNumber").value;

        let box = document.getElementById("childrenDetails");

        box.innerHTML = "";


        for (let i = 1; i <= number; i++) {


            box.innerHTML += `


        <h3>Child ${i} Details</h3>


        <input 
        type="text"
        name="child${i}_name"
        placeholder="Child ${i}'s Name"
        required>


        <input 
        type="date"
        name="child${i}_birthday"
        required>


        <textarea
        name="child${i}_allergies"
        placeholder="Allergies (write 'None' if there are no allergies)"
        required></textarea>


        <textarea
        name="child${i}_medical_conditions"
        placeholder="Medical Conditions (write 'None' if there are no medical conditions)"
        required></textarea>


        `;

        }


        calculatePrice();

    }




    function calculatePrice() {


        let children = Number(document.getElementById("childNumber").value);

        let price = 0;



        if (children === 1) {

            price = 5;

        }


        else if (children === 2) {

            price = 8;

        }


        else if (children === 3) {

            price = 12;

        }


        else if (children === 4) {

            price = 16;

        }


        else {

            price = children * 4;

        }



        document.getElementById("priceDisplay").innerHTML =

            "💷 Total Price: £" + price;


    }



</script>


</body>

</html>
